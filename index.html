<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>RYUKO PAINEL | Login</title>
    <style>
        /* --- CSS: DESIGN EFEITO VERDE NEON (Baseado em image_34.png) --- */
        :root {
            --primary: #00f5c1; /* Verde-água brilhante da image_34.png */
            --primary-dim: rgba(0, 245, 193, 0.6);
            --primary-glow: rgba(0, 245, 193, 0.25);
            --bg-dark: #020202; /* Fundo quase preto para máximo contraste */
            --card-bg: rgba(20, 20, 20, 0.95); /* Cartão ligeiramente transparente */
            --input-bg: #222222;
            --text-main: #ffffff;
            --text-dim: #777;
        }

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            /* Efeito de fundo com linhas luminosas verdes (semelhante a image_34.png) */
            background-image: 
                radial-gradient(circle at center, rgba(0, 30, 20, 0.5) 0%, rgba(0, 0, 0, 0.9) 100%),
                repeating-linear-gradient(45deg, transparent, transparent 10px, rgba(0, 245, 193, 0.03) 10px, rgba(0, 245, 193, 0.03) 11px),
                repeating-linear-gradient(-45deg, transparent, transparent 10px, rgba(0, 245, 193, 0.03) 10px, rgba(0, 245, 193, 0.03) 11px);
        }

        .container {
            width: 100%;
            max-width: 400px;
            padding: 20px;
        }

        .login-card {
            background-color: var(--card-bg);
            border-radius: 25px;
            padding: 40px 30px;
            text-align: center;
            border: 1px solid #333; /* Borda sutil */
            box-shadow: 0 15px 50px rgba(0,0,0,0.9), 0 0 20px rgba(0, 245, 193, 0.1);
        }

        /* --- LOGO CIRCULAR: Usando image_34.png --- */
        .logo-circle {
            width: 100px;
            height: 100px;
            margin: 0 auto 20px;
            border-radius: 50%;
            border: 2px solid var(--primary);
            box-shadow: 0 0 20px var(--primary-glow);
            overflow: hidden; /* Garante que a imagem fique circular */
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .logo-circle img {
            width: 100%;
            height: 100%;
            object-fit: cover; /* Preenche o círculo mantendo a proporção */
        }

        /* --- TÍTULO COM EFEITO VERDE GLOW (igual a image_33.png) --- */
        h1 {
            font-size: 24px;
            text-transform: lowercase;
            margin-bottom: 35px;
            letter-spacing: 2px;
            font-weight: 800;
            color: var(--text-main);
            text-shadow: 0 0 10px var(--primary-glow), 0 0 20px var(--primary-glow);
        }

        /* --- INPUTS (Baseado em image_33.png) --- */
        .input-group {
            text-align: left;
            margin-bottom: 18px;
        }

        .input-label {
            display: block;
            color: var(--text-main);
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 8px;
        }

        .input-wrapper {
            position: relative;
        }

        /* Ícones sutis como na image_33.png */
        .input-icon {
            position: absolute;
            left: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-dim);
            font-size: 18px;
        }

        .input-field {
            width: 100%;
            background-color: var(--input-bg);
            color: var(--text-main);
            border: 1px solid #333;
            border-radius: 12px;
            padding: 15px 15px 15px 45px; /* Padding extra para o ícone */
            font-size: 14px;
            outline: none;
            transition: 0.3s;
        }

        .input-field:focus {
            border-color: var(--primary);
            box-shadow: 0 0 10px var(--primary-glow);
        }

        .input-field::placeholder {
            color: var(--text-dim);
        }

        /* --- BOTÃO ENTRAR: VERDE NEON (Baseado em image_33.png) --- */
        .btn-main {
            background-color: var(--primary);
            color: #000; /* Texto preto para contraste no verde brilhante */
            border: none;
            width: 100%;
            padding: 18px;
            border-radius: 15px;
            font-weight: 900;
            font-size: 16px;
            margin-top: 25px;
            cursor: pointer;
            text-transform: uppercase;
            box-shadow: 0 4px 20px rgba(0, 245, 193, 0.4);
            transition: 0.3s;
        }

        .btn-main:active {
            transform: scale(0.98);
            box-shadow: 0 2px 10px rgba(0, 245, 193, 0.2);
        }

        /* --- RODAPÉ (Igual a image_33.png) --- */
        .footer-text {
            color: var(--text-dim);
            font-size: 11px;
            margin-top: 25px;
            line-height: 1.6;
        }

        .footer-text span.exclusive {
            color: var(--text-main);
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="login-card">
            <div class="logo-circle">
                <img src="RYUKO_SENS.png" alt="Ryuko Sens!">
            </div>

            <h1>ryuko painel</h1>

            <div class="input-group">
                <label class="input-label" for="login">Login</label>
                <div class="input-wrapper">
                    <span class="input-icon">👤</span> <input type="text" id="login" class="input-field" placeholder="Seu login">
                </div>
            </div>

            <div class="input-group">
                <label class="input-label" for="senha">Senha</label>
                <div class="input-wrapper">
                    <span class="input-icon">🔒</span> <input type="password" id="senha" class="input-field" placeholder="Sua senha">
                </div>
            </div>

            <button class="btn-main">Entrar</button>
            
            <div class="footer-text">
                <span class="exclusive">acesso exclusivo 🔒</span><br>
                <span>powered by ryuko</span>
            </div>
        </div>
    </div>

    <script>
        // Bloquear zoom acidental no mobile
        document.addEventListener('touchstart', function (event) {
            if (event.touches.length > 1) {
                event.preventDefault();
            }
        }, { passive: false });
    </script>
</body>
</html>
