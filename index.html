<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>RYUKO PAINEL | PREMIUM iOS</title>
    <style>
        :root {
            --primary: #00f5c1; 
            --bg-dark: #050505;
            --card-bg: #111;
            --input-bg: #1a1a1a;
            --text-dim: #777;
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        body {
            background-color: var(--bg-dark);
            color: white;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
        }

        /* --- NOTIFICAÇÃO --- */
        #toast {
            position: fixed;
            top: -100px;
            left: 50%;
            transform: translateX(-50%);
            background: var(--primary);
            color: black;
            padding: 12px 25px;
            border-radius: 50px;
            font-weight: bold;
            font-size: 14px;
            z-index: 3000;
            transition: top 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow: 0 4px 15px rgba(0, 245, 193, 0.4);
            white-space: nowrap;
        }

        .screen { display: none; width: 100%; max-width: 400px; padding: 20px; animation: fadeIn 0.4s; }
        .active { display: block; }

        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        .card {
            background: var(--card-bg);
            border-radius: 25px;
            padding: 30px 20px;
            text-align: center;
            border: 1px solid #222;
        }

        .logo-main {
            width: 85px; height: 85px;
            border-radius: 50%;
            border: 2px solid var(--primary);
            margin: 0 auto 15px;
            overflow: hidden;
            box-shadow: 0 0 15px var(--primary);
        }
        .logo-main img { width: 100%; height: 100%; object-fit: cover; }

        h1 { font-size: 22px; text-transform: lowercase; margin-bottom: 25px; text-shadow: 0 0 10px var(--primary); }

        .input-field {
            width: 100%; background: var(--input-bg); border: 1px solid #333;
            border-radius: 12px; padding: 15px; color: white; outline: none; margin-bottom: 15px; font-size: 16px;
        }

        .btn-green {
            background: var(--primary); color: black; border: none; width: 100%;
            padding: 16px; border-radius: 14px; font-weight: 900; cursor: pointer;
            text-transform: uppercase;
        }

        .function-row {
            display: flex; justify-content: space-between; align-items: center;
            background: #181818; padding: 15px; border-radius: 15px; margin-bottom: 10px;
        }

        .func-name { display: flex; align-items: center; gap: 12px; font-size: 14px; text-align: left; }
        .ryuko-icon { width: 22px; height: 22px; color: var(--primary); flex-shrink: 0; }

        .switch { position: relative; width: 40px; height: 20px; }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: #333; transition: .4s; border-radius: 20px; }
        .slider:before { position: absolute; content: ""; height: 14px; width: 14px; left: 3px; bottom: 3px; background-color: white; transition: .4s; border-radius: 50%; }
        input:checked + .slider { background-color: var(--primary); }
        input:checked + .slider:before { transform: translateX(20px); }

        .tab-menu { display: flex; justify-content: space-around; margin-bottom: 20px; border-bottom: 1px solid #222; }
        .tab-btn { background: none; border: none; color: var(--text-dim); padding: 10px; font-weight: bold; cursor: pointer; }
        .tab-btn.active-tab { color: var(--primary); border-bottom: 2px solid var(--primary); }

        .modal-overlay {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.92); z-index: 1000; justify-content: center; align-items: center;
        }
        .modal-box { background: #151515; padding: 30px; border-radius: 20px; width: 85%; max-width: 320px; text-align: center; border: 1px solid #333; }
        
        .progress-container { width: 100%; background: #333; height: 8px; border-radius: 10px; margin: 20px 0; overflow: hidden; }
        .progress-bar { width: 0%; height: 100%; background: #888; transition: width 0.1s linear; }
    </style>
</head>
<body>

    <div id="toast">Opção ativada com sucesso!</div>

    <div id="screen-login" class="screen active">
        <div class="card">
            <div class="logo-main"><img src="RYUKO_SENS.png" alt="Logo"></div>
            <h1>ryuko painel</h1>
            <input type="password" id="pass" class="input-field" placeholder="Digite a Senha">
            <button class="btn-green" onclick="tryLogin()">Entrar</button>
        </div>
    </div>

    <div id="screen-main" class="screen">
        <div class="card">
            <div class="logo-main"><img src="RYUKO_SENS.png" alt="Logo"></div>
            <h1>ryuko painel</h1>
            
            <div class="tab-menu">
                <button id="btn-mira" class="tab-btn active-tab" onclick="switchTab('mira')">Mira</button>
                <button id="btn-desempenho" class="tab-btn" onclick="switchTab('desempenho')">Desempenho</button>
            </div>

            <div id="tab-mira">
                <div class="function-row">
                    <span class="func-name">Assistência de Mira Leve</span>
                    <label class="switch"><input type="checkbox" data-name="Mira Leve" onclick="handleToggle(this)"><span class="slider"></span></label>
                </div>
                <div class="function-row">
                    <span class="func-name">Assistência de Mira Precisa</span>
                    <label class="switch"><input type="checkbox" data-name="Mira Precisa" onclick="handleToggle(this)"><span class="slider"></span></label>
                </div>
                <div class="function-row">
                    <span class="func-name">Estabilização de Mira</span>
                    <label class="switch"><input type="checkbox" data-name="Estabilização" onclick="handleToggle(this)"><span class="slider"></span></label>
                </div>
            </div>

            <div id="tab-desempenho" style="display:none;">
                <div class="function-row">
                    <span class="func-name">Otimização de FPS</span>
                    <label class="switch"><input type="checkbox" data-name="Otimização FPS" onclick="handleToggle(this)"><span class="slider"></span></label>
                </div>
                <div class="function-row">
                    <span class="func-name">Redução de Delay</span>
                    <label class="switch"><input type="checkbox" data-name="Redução Delay" onclick="handleToggle(this)"><span class="slider"></span></label>
                </div>
            </div>

            <button class="btn-green" style="background: #1a1a1a; color: white; border: 1px solid #333; margin-top: 20px;" onclick="startFF()">
                🎮 Entrar no Free Fire
            </button>
        </div>
    </div>

    <div id="modal-progress" class="modal-overlay">
        <div class="modal-box">
            <h3 id="progress-text">Configurando...</h3>
            <div class="progress-container"><div id="bar" class="progress-bar"></div></div>
        </div>
    </div>

    <script>
        function showToast(nome, status) {
            const toast = document.getElementById('toast');
            toast.innerText = `${nome} ${status ? 'ativada' : 'desativada'} com sucesso!`;
            toast.style.top = '20px';
            setTimeout(() => { toast.style.top = '-100px'; }, 2500);
        }

        function tryLogin() {
            if(document.getElementById('pass').value === "117") {
                document.getElementById('screen-login').classList.remove('active');
                document.getElementById('screen-main').classList.add('active');
            } else { alert("Senha incorreta!"); }
        }

        function switchTab(tab) {
            document.getElementById('tab-mira').style.display = tab === 'mira' ? 'block' : 'none';
            document.getElementById('tab-desempenho').style.display = tab === 'desempenho' ? 'block' : 'none';
            document.getElementById('btn-mira').classList.toggle('active-tab', tab === 'mira');
            document.getElementById('btn-desempenho').classList.toggle('active-tab', tab === 'desempenho');
        }

        function handleToggle(checkbox) {
            const isChecked = checkbox.checked;
            const nomeOpcao = checkbox.getAttribute('data-name');
            checkbox.checked = !isChecked; 
            
            const modal = document.getElementById('modal-progress');
            const bar = document.getElementById('bar');
            document.getElementById('progress-text').innerText = isChecked ? "Injetando..." : "Removendo...";
            modal.style.display = 'flex';
            bar.style.width = '0%';
            
            let width = 0;
            const interval = setInterval(() => {
                if (width >= 100) {
                    clearInterval(interval);
                    checkbox.checked = isChecked;
                    setTimeout(() => {
                        modal.style.display = 'none';
                        showToast(nomeOpcao, isChecked);
                    }, 300);
                } else {
                    width += 10;
                    bar.style.width = width + '%';
                }
            }, 30);
        }

        function startFF() {
            const modal = document.getElementById('modal-progress');
            const bar = document.getElementById('bar');
            document.getElementById('progress-text').innerText = "Injetando no Game...";
            modal.style.display = 'flex';
            bar.style.width = '0%';
            let width = 0;
            const interval = setInterval(() => {
                if (width >= 100) {
                    clearInterval(interval);
                    window.location.href = "freefire://";
                    setTimeout(() => {
                        window.location.href = "intent://#Intent;scheme=androidamigosff;package=com.dts.freefireth;end";
                    }, 600);
                    setTimeout(() => modal.style.display = 'none', 1000);
                } else {
                    width += 2;
                    bar.style.width = width + '%';
                }
            }, 35);
        }
    </script>
</body>
</html>
