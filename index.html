<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>RYUKO PAINEL | Login</title>
    <style>
        :root {
            --primary: #00f5c1; 
            --primary-glow: rgba(0, 245, 193, 0.3);
            --bg-dark: #020202; 
            --card-bg: rgba(15, 15, 15, 0.98);
            --input-bg: #1a1a1a;
            --text-main: #ffffff;
            --text-dim: #777;
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            font-family: 'Segoe UI', sans-serif;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            background-image: radial-gradient(circle at center, rgba(0, 50, 40, 0.2) 0%, rgba(0, 0, 0, 1) 100%);
        }

        .container { width: 100%; max-width: 380px; padding: 20px; }

        .login-card {
            background-color: var(--card-bg);
            border-radius: 25px;
            padding: 40px 25px;
            text-align: center;
            border: 1px solid #222;
            box-shadow: 0 10px 40px rgba(0,0,0,0.8);
        }

        .logo-circle {
            width: 90px; height: 90px;
            margin: 0 auto 15px;
            border-radius: 50%;
            border: 2px solid var(--primary);
            overflow: hidden;
            box-shadow: 0 0 15px var(--primary-glow);
        }
        .logo-circle img { width: 100%; height: 100%; object-fit: cover; }

        h1 {
            font-size: 22px;
            text-transform: lowercase;
            margin-bottom: 30px;
            letter-spacing: 1px;
            text-shadow: 0 0 10px var(--primary-glow);
        }

        .input-group { text-align: left; margin-bottom: 15px; }
        .input-label { display: block; font-size: 13px; margin-bottom: 5px; color: #bbb; }
        
        .input-field {
            width: 100%;
            background-color: var(--input-bg);
            color: white;
            border: 1px solid #333;
            border-radius: 10px;
            padding: 14px;
            font-size: 14px;
            outline: none;
        }
        .input-field:focus { border-color: var(--primary); }

        .btn-main {
            background-color: var(--primary);
            color: #000;
            border: none;
            width: 100%;
            padding: 16px;
            border-radius: 12px;
            font-weight: 900;
            margin-top: 15px;
            cursor: pointer;
            text-transform: uppercase;
        }

        /* --- MODAL DE ATENÇÃO (ESTILO IMAGEM) --- */
        #modal-attention {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.85);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .modal-content {
            background: #121212;
            border-radius: 20px;
            padding: 30px;
            text-align: center;
            max-width: 320px;
            border: 1px solid #222;
        }

        .icon-warning { color: #ff007f; font-size: 50px; margin-bottom: 15px; }
        .modal-title { font-weight: bold; font-size: 18px; margin-bottom: 15px; text-transform: uppercase; }
        .modal-body { font-size: 13px; color: #aaa; line-height: 1.5; margin-bottom: 20px; }

        .checkbox-area {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin-bottom: 20px;
            font-size: 13px;
        }

        .btn-confirm {
            background: #6b2246; /* Cor vinho da imagem */
            color: white;
            border: none;
            width: 100%;
            padding: 12px;
            border-radius: 10px;
            font-weight: bold;
            opacity: 0.6;
            cursor: not-allowed;
        }

        .btn-confirm.active { opacity: 1; cursor: pointer; background: #8e1d53; }

        /* --- LOADING --- */
        #loading {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: black;
            z-index: 1100;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }
        .spinner {
            width: 40px; height: 40px;
            border: 4px solid #222;
            border-top: 4px solid var(--primary);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        @keyframes spin { 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>

    <div class="container">
        <div class="login-card">
            <div class="logo-circle">
                <img src="RYUKO_SENS.png" alt="Logo">
            </div>
            <h1>ryuko painel</h1>

            <div class="input-group">
                <label class="input-label">Login</label>
                <input type="text" id="user-input" class="input-field" placeholder="Seu login">
            </div>

            <div class="input-group">
                <label class="input-label">Senha</label>
                <input type="password" id="pass-input" class="input-field" placeholder="Sua senha">
            </div>

            <button class="btn-main" onclick="handleLogin()">Entrar</button>
            
            <p style="color: #444; font-size: 10px; margin-top: 20px;">powered by ryuko</p>
        </div>
    </div>

    <div id="loading">
        <div class="spinner"></div>
        <p style="margin-top: 15px; font-size: 14px;">Carregando painel...</p>
    </div>

    <div id="modal-attention">
        <div class="modal-content">
            <div class="icon-warning">⚠️</div>
            <div class="modal-title">ATENÇÃO</div>
            <div class="modal-body">
                O compartilhamento de login com outro dispositivo resultará no bloqueio automático do acesso.<br><br>
                Este painel é permitido apenas para uso em um único telefone.
            </div>
            
            <div class="checkbox-area">
                <input type="checkbox" id="terms" onchange="toggleConfirm()">
                <label for="terms">Li e aceito os termos acima</label>
            </div>

            <button id="confirm-btn" class="btn-confirm" onclick="finalEntry()">CONFIRMAR</button>
        </div>
    </div>

    <script>
        function handleLogin() {
            const pass = document.getElementById('pass-input').value;
            const loading = document.getElementById('loading');

            if (pass === "117") {
                loading.style.display = 'flex';
                
                setTimeout(() => {
                    loading.style.display = 'none';
                    document.getElementById('modal-attention').style.display = 'flex';
                }, 2500);
            } else {
                alert("Senha incorreta!");
            }
        }

        function toggleConfirm() {
            const check = document.getElementById('terms').checked;
            const btn = document.getElementById('confirm-btn');
            if(check) {
                btn.classList.add('active');
            } else {
                btn.classList.remove('active');
            }
        }

        function finalEntry() {
            if(document.getElementById('terms').checked) {
                alert("Painel Ryuko Acessado com Sucesso!");
                // Aqui você pode redirecionar para a página das funções
            }
        }
    </script>
</body>
</html>
