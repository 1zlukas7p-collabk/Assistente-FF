<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Kizaru Painel | Otimizador</title>
    <style>
        /* --- CSS: DESIGN PROFISSIONAL --- */
        :root {
            --primary: #ff007f; /* Rosa Neon */
            --bg-dark: #050505;
            --card-bg: #121212;
            --secondary-bg: #1a1a1a;
            --text-main: #ffffff;
            --text-dim: #777;
        }

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }

        .container {
            width: 100%;
            max-width: 400px;
            padding: 20px;
        }

        .panel-card {
            background-color: var(--card-bg);
            border-radius: 25px;
            padding: 35px 25px;
            text-align: center;
            border: 1px solid #222;
            box-shadow: 0 20px 40px rgba(0,0,0,0.8);
        }

        .logo-area {
            width: 90px;
            height: 90px;
            background: linear-gradient(135deg, #000, var(--primary));
            border-radius: 50%;
            margin: 0 auto 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 2px solid var(--primary);
            box-shadow: 0 0 15px rgba(255, 0, 127, 0.4);
        }

        h1 {
            font-size: 22px;
            text-transform: lowercase;
            margin-bottom: 30px;
            letter-spacing: 2px;
            font-weight: 800;
        }

        /* Linhas de Opções */
        .option-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--secondary-bg);
            margin-bottom: 12px;
            padding: 14px 18px;
            border-radius: 15px;
            transition: 0.3s;
        }

        .option-info {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .option-name {
            font-size: 14px;
            font-weight: 600;
        }

        /* Custom Switch */
        .switch {
            position: relative;
            display: inline-block;
            width: 42px;
            height: 22px;
        }

        .switch input { opacity: 0; width: 0; height: 0; }

        .slider {
            position: absolute;
            cursor: pointer;
            top: 0; left: 0; right: 0; bottom: 0;
            background-color: #333;
            transition: .3s;
            border-radius: 34px;
        }

        .slider:before {
            position: absolute;
            content: "";
            height: 16px; width: 16px;
            left: 3px; bottom: 3px;
            background-color: white;
            transition: .3s;
            border-radius: 50%;
        }

        input:checked + .slider { background-color: var(--primary); }
        input:checked + .slider:before { transform: translateX(20px); }

        /* Botão Principal */
        .btn-main {
            background-color: var(--primary);
            color: white;
            border: none;
            width: 100%;
            padding: 18px;
            border-radius: 15px;
            font-weight: 900;
            font-size: 16px;
            margin-top: 25px;
            cursor: pointer;
            text-transform: uppercase;
            box-shadow: 0 4px 15px rgba(255, 0, 127, 0.3);
        }

        /* Overlay de Carregamento */
        #loading-screen {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.95);
            z-index: 999;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        .loader {
            width: 48px;
            height: 48px;
            border: 5px solid #FFF;
            border-bottom-color: var(--primary);
            border-radius: 50%;
            display: inline-block;
            animation: rotation 1s linear infinite;
        }

        @keyframes rotation { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        #status-msg {
            margin-top: 20px;
            font-size: 14px;
            color: var(--primary);
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="panel-card">
            <div class="logo-area">
                <span style="font-size: 10px; font-weight: bold;">KIZARU</span>
            </div>
            <h1>kizaru painel</h1>

            <div class="option-item">
                <span class="option-name">Otimização de FPS</span>
                <label class="switch"><input type="checkbox" id="fps"><span class="slider"></span></label>
            </div>
            <div class="option-item">
                <span class="option-name">Redução de Delay</span>
                <label class="switch"><input type="checkbox" id="delay"><span class="slider"></span></label>
            </div>
            <div class="option-item">
                <span class="option-name">Estabilidade de Sistema</span>
                <label class="switch"><input type="checkbox" id="system"><span class="slider"></span></label>
            </div>

            <button class="btn-main" onclick="processAndLaunch()">Entrar no Free Fire</button>
            
            <p style="color: var(--text-dim); font-size: 11px; margin-top: 20px;">
                acesso exclusivo 🔒<br>
                <span style="opacity: 0.5;">powered by kizaru</span>
            </p>
        </div>
    </div>

    <div id="loading-screen">
        <span class="loader"></span>
        <div id="status-msg">Iniciando análise...</div>
    </div>

    <script>
        /* --- JAVASCRIPT: LÓGICA DE FUNCIONAMENTO --- */

        async function processAndLaunch() {
            const screen = document.getElementById('loading-screen');
            const msg = document.getElementById('status-msg');
            
            // 1. Mostrar tela de carregamento
            screen.style.display = 'flex';

            // 2. Sequência de mensagens profissionais (Simulação)
            const steps = [
                "Limpando memória temporária...",
                "Otimizando pacotes de dados...",
                "Ajustando sensibilidade touch...",
                "Iniciando Garena Free Fire..."
            ];

            for (const step of steps) {
                msg.innerText = step;
                await new Promise(r => setTimeout(r, 1200)); // Espera 1.2s por frase
            }

            // 3. Redirecionamento Inteligente
            const isAndroid = /Android/i.test(navigator.userAgent);
            
            if (isAndroid) {
                // Abre o app oficial no Android
                window.location.href = "intent://#Intent;scheme=androidamigosff;package=com.dts.freefireth;end";
            } else {
                // Tenta abrir no iOS ou avisa o usuário
                window.location.href = "freefire://";
                setTimeout(() => {
                    screen.style.display = 'none';
                    alert("Se o jogo não abriu automaticamente, certifique-se de que ele está instalado no seu dispositivo.");
                }, 2000);
            }
        }

        // Bloquear zoom acidental no mobile
        document.addEventListener('touchstart', function (event) {
            if (event.touches.length > 1) {
                event.preventDefault();
            }
        }, { passive: false });
    </script>
</body>
</html>
