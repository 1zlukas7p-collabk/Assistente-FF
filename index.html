<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>RYUKO PAINEL | PREMIUM V3.1</title>
    <style>
        :root {
            --primary: #ff007f; 
            --bg-dark: #050505;
            --card-bg: #111;
            --input-bg: #1a1a1a;
            --text-dim: #777;
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; outline: none; }

        body {
            background-color: var(--bg-dark);
            color: white;
            font-family: 'Segoe UI', sans-serif;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
            background-image: radial-gradient(circle at center, rgba(80, 0, 40, 0.15) 0%, rgba(0, 0, 0, 1) 100%);
        }

        #toast {
            position: fixed;
            top: -100px;
            left: 50%;
            transform: translateX(-50%);
            background: var(--primary);
            color: white;
            padding: 12px 25px;
            border-radius: 50px;
            font-weight: 800;
            font-size: 13px;
            z-index: 3000;
            transition: top 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow: 0 4px 20px rgba(255, 0, 127, 0.5);
            white-space: nowrap;
            text-transform: uppercase;
        }

        .screen { display: none; width: 100%; max-width: 400px; padding: 20px; animation: fadeIn 0.4s ease; }
        .active { display: block; }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        .card {
            background: var(--card-bg);
            border-radius: 30px;
            padding: 35px 20px;
            text-align: center;
            border: 1px solid #222;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .logo-main {
            width: 85px; height: 85px;
            border-radius: 50%;
            border: 2px solid var(--primary);
            margin: 0 auto 20px;
            overflow: hidden;
            box-shadow: 0 0 20px rgba(255, 0, 127, 0.3);
            display: flex; align-items: center; justify-content: center;
        }
        .logo-main img { width: 100%; height: 100%; object-fit: cover; }

        h1 { font-size: 20px; text-transform: lowercase; margin-bottom: 30px; letter-spacing: 2px; text-shadow: 0 0 10px var(--primary); }

        .input-group { margin-bottom: 15px; text-align: left; }
        .input-field {
            width: 100%; background: var(--input-bg); border: 1px solid #333;
            border-radius: 15px; padding: 16px; color: white; font-size: 15px;
            transition: 0.3s;
        }

        .btn-green {
            background: var(--primary); color: white; border: none; width: 100%;
            padding: 18px; border-radius: 15px; font-weight: 900; cursor: pointer;
            text-transform: uppercase; margin-top: 10px; font-size: 14px;
        }

        .tab-menu { display: flex; justify-content: space-around; margin-bottom: 25px; border-bottom: 1px solid #222; }
        .tab-btn { background: none; border: none; color: var(--text-dim); padding: 12px; font-weight: bold; cursor: pointer; font-size: 14px; }
        .tab-btn.active-tab { color: var(--primary); border-bottom: 3px solid var(--primary); }

        .function-row {
            display: flex; justify-content: space-between; align-items: center;
            background: #181818; padding: 16px; border-radius: 18px; margin-bottom: 12px;
            border: 1px solid #222;
        }

        .func-name { display: flex; align-items: center; gap: 12px; font-size: 13.5px; font-weight: 600; color: #eee; }
        .ryuko-icon { width: 22px; height: 22px; color: var(--primary); flex-shrink: 0; }

        .switch { position: relative; width: 42px; height: 22px; }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: #333; transition: .4s; border-radius: 20px; }
        .slider:before { position: absolute; content: ""; height: 16px; width: 16px; left: 3px; bottom: 3px; background-color: white; transition: .4s; border-radius: 50%; }
        input:checked + .slider { background-color: var(--primary); }
        input:checked + .slider:before { transform: translateX(20px); }

        .modal-overlay {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.95); z-index: 1000; justify-content: center; align-items: center;
        }
        .modal-box { background: #151515; padding: 35px; border-radius: 25px; width: 85%; max-width: 320px; text-align: center; border: 1px solid #333; }
        .progress-container { width: 100%; background: #333; height: 6px; border-radius: 10px; margin: 25px 0; overflow: hidden; }
        .progress-bar { width: 0%; height: 100%; background: var(--primary); transition: width 0.1s linear; }
    </style>
</head>
<body>

    <div id="toast">Sucesso!</div>

    <div id="screen-login" class="screen active">
        <div class="card">
            <div class="logo-main"><img src="RYUKO_SENS.png" alt="Logo"></div>
            <h1>ryuko login</h1>
            <div class="input-group"><input type="text" id="user" class="input-field" placeholder="Usuário"></div>
            <div class="input-group"><input type="password" id="pass" class="input-field" placeholder="Senha"></div>
            <button class="btn-green" onclick="tryLogin()">Acessar Painel</button>
        </div>
    </div>

    <div id="screen-main" class="screen">
        <div class="card">
            <div class="logo-main"><img src="RYUKO_SENS.png" alt="Logo"></div>
            <h1>ryuko painel</h1>
            
            <div class="tab-menu">
                <button id="btn-mira" class="tab-btn active-tab" onclick="switchTab('mira')">Mira</button>
                <button id="btn-desempenho" class="tab-btn" onclick="switchTab('desempenho')">Sistema</button>
            </div>

            <div id="tab-mira">
                <div class="function-row"><span class="func-name"><svg class="ryuko-icon" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="2" fill="none"/><line x1="12" y1="3" x2="12" y2="21" stroke="currentColor" stroke-width="2"/><line x1="3" y1="12" x2="21" y2="12" stroke="currentColor" stroke-width="2"/></svg>Assistência de Mira Leve</span><label class="switch"><input type="checkbox" data-name="Mira Leve" onclick="handleToggle(this)"><span class="slider"></span></label></div>
                <div class="function-row"><span class="func-name"><svg class="ryuko-icon" viewBox="0 0 24 24"><path d="M4,8 V5 H8 M16,5 H20 V8 M20,16 V19 H16 M8,19 H4 V16" stroke="currentColor" stroke-width="2" fill="none"/><circle cx="12" cy="12" r="2.5" stroke="currentColor" stroke-width="2" fill="none"/></svg>Assistência de Mira Precisa</span><label class="switch"><input type="checkbox" data-name="Mira Precisa" onclick="handleToggle(this)"><span class="slider"></span></label></div>
                <div class="function-row"><span class="func-name"><svg class="ryuko-icon" viewBox="0 0 24 24"><path d="M12,4 V20 M6,12 A6,6 0 0,0 18,12" stroke="currentColor" stroke-width="2" fill="none"/><circle cx="12" cy="4" r="2" stroke="currentColor" stroke-width="2" fill="none"/></svg>Estabilização de Mira</span><label class="switch"><input type="checkbox" data-name="Estabilização" onclick="handleToggle(this)"><span class="slider"></span></label></div>
                <div class="function-row"><span class="func-name"><svg class="ryuko-icon" viewBox="0 0 24 24"><path d="M12,4 L12,14 M9,7 L12,4 L15,7 M12,20 L12,10 M9,17 L12,20 L15,17" stroke="currentColor" stroke-width="2" fill="none"/></svg>Controle de Recuo</span><label class="switch"><input type="checkbox" data-name="Recoil" onclick="handleToggle(this)"><span class="slider"></span></label></div>
                <div class="function-row"><span class="func-name"><svg class="ryuko-icon" viewBox="0 0 24 24"><path d="M4,17 A10,10 0 1,1 20,17" stroke="currentColor" stroke-width="2" fill="none"/><line x1="12" y1="12" x2="16" y2="8" stroke="currentColor" stroke-width="2"/></svg>Ajuste Fino de Precisão</span><label class="switch"><input type="checkbox" data-name="Ajuste Fino" onclick="handleToggle(this)"><span class="slider"></span></label></div>
            </div>

            <div id="tab-desempenho" style="display:none;">
                <div class="function-row"><span class="func-name"><svg class="ryuko-icon" viewBox="0 0 24 24"><path d="M13,3 L13,10 L19,10 L11,21 L11,14 L5,14 L13,3 Z" stroke="currentColor" stroke-width="2" fill="none"/></svg>Otimização de FPS</span><label class="switch"><input type="checkbox" data-name="Boost FPS" onclick="handleToggle(this)"><span class="slider"></span></label></div>
                <div class="function-row"><span class="func-name"><svg class="ryuko-icon" viewBox="0 0 24 24"><path d="M10,8 C11,6 13,6 14,8 M17,11 A5,5 0 0,0 7,11 A5,5 0 0,0 17,11" stroke="currentColor" stroke-width="2" fill="none"/></svg>Reduzir Delay</span><label class="switch"><input type="checkbox" data-name="Anti-Delay" onclick="handleToggle(this)"><span class="slider"></span></label></div>
                <div class="function-row"><span class="func-name"><svg class="ryuko-icon" viewBox="0 0 24 24"><path d="M12,2 L4,5 V11 A8,8 0 0,0 12,19 A8,8 0 0,0 20,11 V5 L12,2 Z" stroke="currentColor" stroke-width="2" fill="none"/></svg>Estabilidade OS</span><label class="switch"><input type="checkbox" data-name="Estabilidade" onclick="handleToggle(this)"><span class="slider"></span></label></div>
                <div class="function-row"><span class="func-name"><svg class="ryuko-icon" viewBox="0 0 24 24"><path d="M8,4 L16,12 L12,12 L14,18 L11,19 L9,13 L8,13 Z" stroke="currentColor" stroke-width="2" fill="none"/></svg>Sensibilidade Touch</span><label class="switch"><input type="checkbox" data-name="Sensi Touch" onclick="handleToggle(this)"><span class="slider"></span></label></div>
                <div class="function-row"><span class="func-name"><svg class="ryuko-icon" viewBox="0 0 24 24"><path d="M17,5 A10,10 0 0,0 7,15 M10,10 A5,5 0 0,1 15,15" stroke="currentColor" stroke-width="2" fill="none"/></svg>Desempenho Máximo</span><label class="switch"><input type="checkbox" data-name="Max Perf" onclick="handleToggle(this)"><span class="slider"></span></label></div>
            </div>

            <button class="btn-green" style="background: #1a1a1a; color: white; border: 1px solid #333; margin-top: 15px;" onclick="startFF()">🎮 Entrar no Free Fire</button>
        </div>
    </div>

    <div id="modal-progress" class="modal-overlay">
        <div class="modal-box"><h3 id="progress-text">CONFIGURANDO...</h3><div class="progress-container"><div id="bar" class="progress-bar"></div></div></div>
    </div>

    <script>
        function showToast(n, s) { 
            const t = document.getElementById('toast'); 
            t.innerText = `${n}: ${s ? 'ON' : 'OFF'}`; 
            t.style.top = '25px'; 
            setTimeout(() => t.style.top = '-100px', 2000); 
        }
        function tryLogin() { 
            if(document.getElementById('pass').value === "117") { 
                document.getElementById('screen-login').classList.remove('active'); 
                document.getElementById('screen-main').classList.add('active'); 
            } else alert("Senha 117!"); 
        }
        function switchTab(t) {
            document.getElementById('tab-mira').style.display = t === 'mira' ? 'block' : 'none';
            document.getElementById('tab-desempenho').style.display = t === 'desempenho' ? 'block' : 'none';
            document.getElementById('btn-mira').classList.toggle('active-tab', t === 'mira');
            document.getElementById('btn-desempenho').classList.toggle('active-tab', t === 'desempenho');
        }
        function handleToggle(c) {
            const isChecked = c.checked; const n = c.getAttribute('data-name'); c.checked = !isChecked;
            const m = document.getElementById('modal-progress'); const b = document.getElementById('bar');
            document.getElementById('progress-text').innerText = "Configurando.."; m.style.display = 'flex'; b.style.width = '0%';
            let w = 0; const i = setInterval(() => {
                if (w >= 100) { clearInterval(i); c.checked = isChecked; setTimeout(() => { m.style.display = 'none'; showToast(n, isChecked); }, 300); }
                else { w += 10; b.style.width = w + '%'; }
            }, 50);
        }
        function startFF() { 
            window.location.href = "freefire://"; 
            setTimeout(() => { window.location.href = "intent://#Intent;scheme=androidamigosff;package=com.dts.freefireth;end"; }, 600);
        }
    </script>
</body>
</html>
